# "paper" is the exact PerturbDiff comparison; "extended" comes from DiffA.pdf.
baselines:
  mean:
    tier: paper
    kind: native
    runner: end_to_end
    repository: https://github.com/ArcInstitute/cell-eval
    revision: 0.6.6
    datasets: [pbmc, tahoe100m, replogle, norman]
  linear:
    tier: paper
    kind: official_external
    runner: requires_dataset_adapter
    repository: https://github.com/const-ae/linear_perturbation_prediction-Paper
    revision: bfa6eeea2bd145a1af2ec0127a2e808cc38456a9
    datasets: [pbmc, tahoe100m, replogle, norman]
  cpa:
    tier: paper
    kind: official_external
    runner: requires_dataset_adapter
    repository: https://github.com/theislab/cpa
    revision: fbd7c0250edc23eff003a10c99655579c53afd63
    datasets: [pbmc, tahoe100m, replogle, norman]
  state:
    tier: paper
    kind: official_external
    runner: requires_dataset_adapter
    repository: https://github.com/ArcInstitute/state
    revision: da4178c930dc917dac6b56faf10a33e21bd8e905
    datasets: [pbmc, tahoe100m, replogle, norman]
  cellflow:
    tier: paper
    kind: official_external
    runner: requires_dataset_adapter
    repository: https://github.com/theislab/CellFlow
    revision: 446ed6073c60ac2e8db13c4ea096a43cdec288b2
    datasets: [pbmc, tahoe100m, replogle, norman]
  squidiff:
    tier: paper
    kind: official_external
    runner: requires_dataset_adapter
    repository: https://github.com/siyuh/Squidiff
    revision: abdfc27d84947dcccd745d1067c0840a41d32eb8
    datasets: [pbmc, tahoe100m, replogle, norman]
  perturbdiff_scratch:
    tier: paper
    kind: official_external
    runner: released_checkpoint_end_to_end
    repository: https://github.com/DeepGraphLearning/PerturbDiff
    revision: f4e27c155be5325418c4cb3182453d4022754e91
    datasets: [pbmc, tahoe100m, replogle]
  perturbdiff_finetuned:
    tier: paper
    kind: official_external
    runner: released_checkpoint_end_to_end
    repository: https://github.com/DeepGraphLearning/PerturbDiff
    revision: f4e27c155be5325418c4cb3182453d4022754e91
    datasets: [pbmc, tahoe100m, replogle]

  gears:
